name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate fresh Android project
        run: |
          mkdir -p /tmp/blank_app
          cd /tmp/blank_app
          flutter create --platforms=android --no-pub -t app blank_app
          cp -r /tmp/blank_app/blank_app/android ./android_fresh
          rm -rf android
          mv android_fresh android
          ls -la android/

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (arm64)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Show output
        run: |
          find build/app/outputs/flutter-apk/ -name "*.apk" | xargs ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasku-app-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
