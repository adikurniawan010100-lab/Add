name: Generate Android

on:
  workflow_dispatch:

jobs:
  generate-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backup source files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          cp .metadata /tmp/backup/ 2>/dev/null || true

      - name: Generate fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --no-pub .

      - name: Restore source files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          cp /tmp/backup/.metadata . 2>/dev/null || true
          rm -rf /tmp/backup

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android/

      - name: Upload all source
        uses: actions/upload-artifact@v4
        with:
          name: source-files
          path: |
            lib/
            pubspec.yaml
            .metadata
