name: Build APK

on:
  push:
    paths:
      - '!**'
      - 'pubspec.yaml'
      - 'lib/**'
      - 'android/**'
      - '.github/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate Android project
        run: flutter create --platforms=android --project-app-path=. .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Show output
        run: |
          find build/app/outputs/flutter-apk/ -name "*.apk" | xargs ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasku-app-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
