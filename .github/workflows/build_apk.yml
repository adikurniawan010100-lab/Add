name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backup lib directory
        run: cp -r lib lib_backup

      - name: Regenerate Android project
        run: |
          rm -rf android
          flutter create --platforms=android .
          rm -rf lib .dart_tool
          mv lib_backup lib

      - name: Add flutter_localizations to pubspec
        run: |
          python3 << 'PYEOF'
          import re
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          
          if 'flutter_localizations' not in content:
              # Add flutter_localizations after flutter sdk
              content = re.sub(
                  r'(  flutter:\n    sdk: flutter)',
                  r'\1\n  flutter_localizations:\n    sdk: flutter',
                  content
              )
              with open('pubspec.yaml', 'w') as f:
                  f.write(content)
              print("Added flutter_localizations")
          else:
              print("flutter_localizations already present")
          
          # Verify
          with open('pubspec.yaml', 'r') as f:
              for line in f:
                  if 'flutter' in line:
                      print(f'  {line.rstrip()}')
          PYEOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (arm64)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Show output
        run: |
          find build/app/outputs/flutter-apk/ -name "*.apk" | xargs ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasku-app-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
